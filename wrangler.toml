name = "youneek-pro-radarynk222"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run the Worker on every request so HTML is never CDN-cached and stale
# hashed /assets/* files 404 instead of returning the SPA shell.
run_worker_first = true

[vars]
# WeatherKit secrets: WEATHERKIT_TEAM_ID, WEATHERKIT_KEY_ID, WEATHERKIT_SERVICE_ID, WEATHERKIT_PRIVATE_KEY
# See WEATHERKIT.md for Apple Developer setup.
